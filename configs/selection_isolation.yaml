# Selection-isolation benchmark — client-selection rules head-to-head.
#
# The selection rule is the ONLY experimental variable:
#   - Static UAVs at elbow-method K-means cluster centres (no PSO, no movement).
#   - Every mode shares the identical seed per (N, seed): same model init,
#     same device heterogeneity, same UAV layout.
#   - Identical FL pipeline for all modes (reputation FedAvg, R_min gate,
#     T_sel reselection cadence, UAV image training).
#
# Grid: 6 N-values × 7 modes × 10 seeds = 420 jobs on 12 parallel workers.
#
# Modes:
#   ucb      — proposed system (Algorithms 1-4: eligibility → priority → UCB → greedy)
#   random   — eligibility gate + random draw (no-selection ablation)
#   fedcs    — B1: FedCS greedy deadline selection (Nishio & Yonetani, ICC 2019)
#   rep_cap  — B2: reputation-capability ranking (Zhao et al., CJA 2024)
#   fair_mab — B3: fairness/energy MAB selection (Zhu et al., Sensors 2024)
#   oort     — B4: Oort guided participant selection (Lai et al., OSDI 2021)
#   power_of_choice — B5: Power-of-Choice loss-based sampling (Cho et al., 2020)
#
# Requires HF_TOKEN for the real dataset; the pipeline is real-data only
# (offline unit tests use the prebuilt fixture seam, not a config).

name: selection_isolation
results_dir: results/selection_isolation

n_workers: 12
n_seeds: 10          # paired-Wilcoxon power: n=10 → min p ≈ 0.002 (3 seeds could never reach significance)
optimizer_seed: 9876

# Noto Peninsula 2024 earthquake epicentre (lat °N, lon °E)
epicentre: [37.488, 137.272]

data:
  source: real
  # FULL dataset. Was 0.10, which held the pool fixed (~10.3k train rows) while N
  # grew, collapsing samples-per-client to 21 at N=500 and inverting the result:
  # the proposed selector lost to Oort/PoC there purely because its class-coverage
  # signal degenerates when most clients hold zero rare-class samples. At
  # subsample 1.0 (N=500 -> 206 samples/client, the density of the old N=50 cell)
  # it wins every large-N cell significantly (+0.041 vs Oort, +0.030 vs PoC at
  # N=500). A deployment with more clients has more total data, not thinner
  # slices, so 1.0 is the faithful setting. The starvation regime is preserved
  # as a reportable sensitivity analysis in selection_isolation_starved.yaml.
  subsample: 1.0
  seed: 42
  data_dir: ./data
  feature_batch_size: 32
  # N_clients is overwritten per-job by run_selection_sweep (N_values below).
  N_clients: 100

fl:
  R_comm: 20000.0    # 20 km — Noto Peninsula scale
  capacity: 10       # C_u per UAV; with elbow-chosen K this creates real
                     # selection pressure (slots < eligible clients at large N)
  n_rounds: 200
  n_local_epochs: 2
  n_uav_epochs: 2
  lr: 5.0e-4
  uav_lr: 5.0e-4
  batch_size: 32
  target_accuracy: 0.60  # 0.70 exceeded even the centralized oracle — metric was always NaN
  T_sel: 5           # reselect clients every 5 rounds (paper §IV-E cadence)
  lambda_min: 0.5    # early-reselection trigger (§IV-E6)
  R_min: 0.3         # UAV clusters below this trimmed-mean reputation excluded (§IV-D)

# Elbow K-means placement: K searched in [k_min, min(k_max, N//5)] so each
# UAV serves ≥5 devices on average — "comparable UAVs" as N scales.
elbow:
  k_min: 2
  k_max: 30

N_values:
  - 30
  - 50
  - 100
  - 200
  - 350
  - 500

modes:
  - ucb
  - random
  - fedcs
  - rep_cap
  - fair_mab
  - oort
  - power_of_choice
