# Heterogeneous-fleet supplement to the tier1_core headline.
#
# Same binding-capacity regime, equal radius, and Bayesian fitness weights as
# tier1_core (all inherited). The only change: the fleet is heterogeneous —
# per-UAV capacity drawn uniformly in mean*(1+/-0.5) -> caps in [7, 22] around
# the mean 15, and battery in 1.0*(1+/-0.3). Heterogeneity is drawn after all
# other RNG, so each seed shares its homogeneous twin's device layout. Now
# placement must co-optimize WHICH UAV (large vs small) covers WHICH region — a
# joint capacity/coverage/value problem the value-blind physics baselines
# (mozaffari/alzenad/centroid) cannot see.
#
# Purpose: show a more realistic heterogeneous fleet does not weaken — and
# modestly widens — PSO's edge over the physics/greedy baselines.
extends: tier1_core.yaml

name: tier1_regime_hetero
results_dir: results/tier1_regime_hetero

n_seeds: 20

problem:
  capacity_cv: 0.5    # per-UAV capacity ~ U(7, 22) around mean 15
  battery_cv: 0.3     # per-UAV battery ~ U(0.7, 1.0)
