# Tier-1 core config: the headline placement comparison (PSO vs GA vs the
# physics/greedy baselines).
#
# Three design decisions define this benchmark (see REPORTS/results_provenance.md):
#   1. EQUAL-RADIUS SCORING (fairness). Every method is scored at the same ~500 m
#      coverage radius. The physics baselines are constrained to max_path_loss_db=95
#      so their derived radius r*≈499 m matches the R_comm=500 m gate PSO/GA use;
#      the previous 100 dB gave them r*=618 m (a 1.53x ground-area advantage). This
#      is a correction of a scoring asymmetry, not a tuning knob.
#   2. BINDING CAPACITY (informative regime). capacity=15, K=10 -> 150 slots < N=250
#      clients, so the assignment is non-degenerate and placement must choose whom to
#      serve. (Slack capacity, 300>250, made coverage saturate and hid method
#      differences; see the tier1_equal_radius saturating ablation.)
#   3. BAYESIAN-DERIVED FITNESS WEIGHTS. w=(0.811,0.03,0.159) from the Optuna study in
#      scripts/tune_weights.py (objective: downstream proposed_hfl macro_f1;
#      results/hpo/), not the paper's hand-picked 0.6/0.3/0.1. The weights are strongly
#      identified (coverage corr +0.78 with downstream accuracy) and match fitness.py's
#      default. Applied identically to every method.
name: tier1_core

n_workers: 8
results_dir: results/tier1_core

instance_seed: 1234
optimizer_seed: 9876
n_seeds: 30          # >=30 for statistical power

scenarios:
  - distribution: uniform
    N: 250
    K: 10
  - distribution: clustered
    N: 250
    K: 10
  - distribution: epicenter_biased
    N: 250
    K: 10

area:
  x: [0.0, 5000.0]
  y: [0.0, 5000.0]
  z: [20.0, 120.0]

value:
  beta_mode: pinned
  t: 0
  T_decay: 20

problem:
  R_comm: 500.0
  B_min_uav: 0.2
  capacity: 15         # K*capacity = 10*15 = 150 slots < N=250 -> capacity binds
  uav_battery: 1.0
  prev_mode: stale

# Bayesian-derived scalarization weights (Optuna, scripts/tune_weights.py; see the
# header). Coverage-dominant because an uncovered client cannot participate at all.
fitness:
  w1: 0.811
  w2: 0.03
  w3: 0.159

budget:
  P: 100
  G_max: 200         # full evaluation budget = 20,000 fitness evals

# Per-method hyperparameters (P / G_max always come from `budget` above).
# Listed explicitly so ablations are one-line config edits, not code edits.
optimizer_params:
  pso:
    c1: 2.05
    c2: 2.05
    vmax_frac: 0.2
    ring_k: 2
    delta_stag: 1.0e-4
    G_stag: 20
    rho: 0.2
    p_turb: 0.1
    early_stop_frac: 0.95
    jitter_m: 10.0
    use_constriction: true
    topology: ring
    use_clamp: true
    use_stagnation: true
    use_turbulence: true
    seeding: value_kmeans
  ga:
    crossover_prob: 0.9
    eta_c: 15.0
    eta_m: 20.0
    tournament_size: 3
    n_elite: 2
    early_stop_frac: 0.95
  # Placement literature baselines (path-loss-derived coverage radius; see
  # uavbench/problem/path_loss.py). EQUAL-RADIUS FAIRNESS FIX: max_path_loss_db=95
  # at 2 GHz yields r*≈499 m over the z=[20,120] band, matching the R_comm=500 m
  # gate PSO/GA are scored at. The old 100 dB gave r*=618 m — a 1.53x ground-area
  # advantage that let the baselines win uniform on range alone, not placement.
  mozaffari2016:
    environment: suburban
    freq_ghz: 2.0
    max_path_loss_db: 95.0
  alzenad2017:
    environment: suburban
    freq_ghz: 2.0
    max_path_loss_db: 95.0

methods:
  - pso
  - ga
  - centroid
  - static
  - random
  - mozaffari2016
  - alzenad2017
