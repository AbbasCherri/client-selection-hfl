# Class-awareness realism ablation — arm 5/6: placement contrast at a tighter radius.
#
# History, because this file's purpose changed twice
# --------------------------------------------------
# It was created to fix a powerless contrast: arms 1-4 ran at R_comm = 20 km
# where proposed_hfl covered 99.95% of clients, so class-aware placement had
# nothing left to steer and `true_placeaware` vs `true_placeblind` was null by
# construction (measured +0.0035, p=0.77). A first attempt at 8 km moved
# coverage only to 94.6% and returned another null (-0.0075, p=0.77) — better
# powered, still weak.
#
# Both of those runs are now void. On 2026-08-08 the altitude band moved from
# 20-120 m to 100-1000 m and R_comm from 20 km to 2 km, because the old pairing
# was physically incoherent: the radius-maximizing altitude pinned at the 120 m
# ceiling for any radius above ~324 m, and at 20 km the elevation angle of
# 0.34 deg gave P(LoS) ~ 3% — a 97% NLoS link, i.e. an aerial base station with
# its line-of-sight advantage switched off. See paper_full.yaml and
# tests/sanity_checks/check_altitude_band.py.
#
# What this arm is now
# --------------------
# The main operating point moved again on 2026-08-09, from 2 km to 5 km with
# K=20/capacity=6 (see paper_full.yaml: per-UAV capacity, not radius, is what
# decides whether the model learns). This radius was rescaled with it.
#
# It was 800 m, chosen as 0.4x the then-current 2 km main point. Left at 800 m
# against a 5 km main point it would be 6x tighter than intended: 20 aircraft
# with 800 m discs cover single-digit percent of the peninsula, so the arm would
# not have measured a tighter placement contrast — it would have measured
# majority-class collapse, failed the gate, and (because run_rebuild_v5.sh
# aborts on ANY collapsed arm, not just the first) taken the fleet sweep,
# coverage sweep and paper_full down with it.
#
# 3000 m keeps the original intent — meaningfully tighter than the main point,
# inside the coherent interval (270-5400 m) — while staying in a regime the
# pipeline can learn in: ~120 slots against a covered population that still
# exceeds them, so selection binds, and ~6 clients per UAV shard, at the
# capacity the recipe was tuned for rather than below the floor where the
# fusion heads go single-class.
#
# Note this pair is now a robustness point rather than the load-bearing test.
# Arms 1-4 at 5 km already sit at ~82% coverage, well below saturation, and the
# placement contrast there is live (+0.041 true_placeaware over true_placeblind)
# where at 20 km it was null by construction. This pair asks whether that effect
# grows as coverage tightens further — a dose-response, not an existence proof.
#
# Check `coverage_pct` in both arms before trusting either contrast.
#
# Paired against class_realism_bind_noplace: same seeds, N, method and rounds,
# so placement_class_aware is the only variable.

extends: class_realism.yaml

name: class_realism_bind
results_dir: results/class_realism_bind

fl:
  R_comm: 3000.0     # was 800.0 — rescaled with the 2 km -> 5 km main point
  class_source: "true"
  placement_class_aware: true
