# Class-awareness realism ablation — arm 5/6: placement contrast at a tighter radius.
#
# History, because this file's purpose changed twice
# --------------------------------------------------
# It was created to fix a powerless contrast: arms 1-4 ran at R_comm = 20 km
# where proposed_hfl covered 99.95% of clients, so class-aware placement had
# nothing left to steer and `true_placeaware` vs `true_placeblind` was null by
# construction (measured +0.0035, p=0.77). A first attempt at 8 km moved
# coverage only to 94.6% and returned another null (-0.0075, p=0.77) — better
# powered, still weak.
#
# Both of those runs are now void. On 2026-08-08 the altitude band moved from
# 20-120 m to 100-1000 m and R_comm from 20 km to 2 km, because the old pairing
# was physically incoherent: the radius-maximizing altitude pinned at the 120 m
# ceiling for any radius above ~324 m, and at 20 km the elevation angle of
# 0.34 deg gave P(LoS) ~ 3% — a 97% NLoS link, i.e. an aerial base station with
# its line-of-sight advantage switched off. See paper_full.yaml and
# tests/sanity_checks/check_altitude_band.py.
#
# What this arm is now
# --------------------
# The R_comm correction alone should largely fix the powerlessness: at 2 km with
# K=20 coverage is partial rather than saturated, so arms 1-4 finally have
# headroom for placement to act. This pair adds a *second, tighter* operating
# point at 800 m — still inside the coherent interval (270-2700 m) — to test
# whether class-aware placement earns its information assumption when coverage
# binds harder.
#
# Check `coverage_pct` in both before trusting either contrast. If coverage at
# 2 km is already well below saturation, arms 1/3 carry the result and this pair
# is a robustness point; if 2 km still saturates, this pair carries it.
#
# Paired against class_realism_bind_noplace: same seeds, N, method and rounds,
# so placement_class_aware is the only variable.

extends: class_realism.yaml

name: class_realism_bind
results_dir: results/class_realism_bind

fl:
  R_comm: 800.0
  class_source: "true"
  placement_class_aware: true
