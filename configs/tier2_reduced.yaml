# Tier-2 reduced config: REAL data at a small subsample, tiny N, few rounds.
# The fast end-to-end check of the real pipeline (used by `uavbench smoke_tier2`).
# Requires HF_TOKEN on first run; afterwards the metadata/partition caches under
# ./data make it re-runnable offline. All experiments are real-data only —
# offline unit tests use the prebuilt fixture seam instead of a config.
name: tier2_reduced
results_dir: results/tier2_reduced

n_workers: 1          # Tier-2 is run sequentially (one model per method)
optimizer_seed: 9876

data:
  source: real
  subsample: 0.1      # ~12.8k rows; matches the checked-in metadata cache key
  N_clients: 20       # IoT clients (K-means geographic partition)
  seed: 42
  data_dir: ./data
  feature_batch_size: 32

fl:
  K: 3                # number of UAVs / hover positions
  R_comm: 15000.0     # metres — covers ~15 km; meaningful variation at this scale
  capacity: 10        # max clients per UAV
  n_rounds: 5
  n_local_epochs: 1
  lr: 1.0e-3
  batch_size: 16
  target_accuracy: 0.50

# Shared metaheuristic budget (Tier-1 compatible keys)
budget:
  P: 20               # reduced population for smoke speed
  G_max: 20

methods:
  - pso
  - static
  - random
