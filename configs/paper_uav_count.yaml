# Fleet-size sweep — how much does the placement algorithm matter as K varies?
#
# The question
# ------------
# The 2026-08-07 coverage sweep found that placement method does not move
# macro-F1: 6 of 105 placement-vs-placement comparisons significant, and
# `mclp_place` never Holm-beats uniform-random placement at any radius. That
# sweep is now void — it ran under the 20-120 m altitude band, where the
# radius-maximizing altitude pinned at the ceiling for any radius above ~324 m
# and the 20 km cells were a 97% NLoS grazing link. Placement was being measured
# almost entirely outside the regime where the channel has an interior optimum.
#
# This sweep runs in the corrected regime (100-2000 m band, R_comm = 5 km, both
# inside the coherent interval) and varies the fleet instead of the radio.
#
# The grid SHRINKS rather than grows, which reverses this file's second version
# as well as its first. The 2 km probe that motivated growing it
# (results/probe_coverage_vs_k: mclp_place covering 42.5% at K=20, 89% at K=60)
# was measured at a radius that has since been retired, and the reach scales
# with the square of it. At the 5 km operating point the same fleet sizes are
# far from starved — measured at 100 rounds in results/probe_topology:
#
#     K=20  82.3%      K=40  86.0%      K=120  85.0%
#     K=30  84.8%      K=60  88.7%
#
# Coverage is essentially FLAT from K=20 upward: twenty aircraft with 5 km discs
# (20 x 78.5 km^2 against a ~1500 km^2 peninsula) already blanket most of the
# region, and further aircraft mostly overlap. Sweeping K upward therefore
# measures nothing — every cell above 20 is the same coverage with a different
# aircraft count. The interesting range is BELOW 20, where discs stop tiling the
# region and placement quality decides what is reachable.
#
# So the question the sweep asks is the operational one: how small a fleet can a
# given placement rule get away with? A method holding coverage at K=10 where
# uniform-random needs three times the aircraft is a far stronger claim than a
# macro-F1 delta, and it is the honest framing for a method whose value shows up
# in coverage rather than in end-task accuracy.
#
# Why capacity is FIXED and the slot budget is allowed to vary
# ------------------------------------------------------------
# This is the reverse of this file's previous design, and the reversal is
# forced by measurement rather than taste.
#
# The old design paired each K with a capacity holding K*C = 120, so that
# per-round data volume stayed constant and a larger fleet bought coverage
# rather than throughput. That is a sound instinct and it is unusable here:
# results/probe_topology measured the K*C = 120 ladder directly and found that
# per-UAV capacity, not coverage and not participation, decides whether the
# pipeline learns at all —
#
#     K=120/cap=1  0.199 (below the constant-predictor floor)   unlearns
#     K=60 /cap=2  0.274                                        unlearns
#     K=40 /cap=3  0.286                                        unlearns
#     K=30 /cap=4  0.379                                        learns
#     K=20 /cap=6  0.395                                        learns
#
# so the old grid's entire high-K half sits in a regime that forgets what it
# learned by round 10. It would have reported capacity-induced collapse as a
# fleet-size effect on placement, with coverage flat at 82-89% across every cell
# to make it look benign.
#
# The cause is structural, not incidental: the UAV tier trains img_proj+fusion
# on the pooled shard of its assigned clients, so capacity IS the width of that
# shard, and Noto damage classes are geographically clustered enough that a
# 2-client shard inside one 5 km disc is near single-class.
#
# So capacity is pinned at 6 — paper_full's operating point, above the floor —
# and total slots K*C scale with the fleet. run_uav_sweep will warn that the
# product drifts 6x across the grid; that is intended here.
#
# What this costs, stated plainly: fleet size and per-round data volume are now
# confounded, so the TREND across K mixes "more aircraft reach more clients"
# with "more aircraft train on more data". The per-K contrasts are unaffected —
# every method within a cell shares that cell's K and capacity — so the
# placement comparison this sweep exists for stays internally controlled, and it
# is only the cross-K reading that carries the confound. Report coverage_pct
# beside macro_f1 at every K so a reader can separate them.
#
# The grid stops at K=30 (180 slots against ~185 covered) because beyond that
# the slot budget exceeds the covered population and the selection rule stops
# binding, which would silently change what is being compared.
#
# Built-in validity check: `flat_fl` has no UAVs, so its row MUST be flat across
# every K. If it is not, the sweep is leaking something that is not placement.
#
# Read `coverage_pct` next to `macro_f1` in every cell. It is what distinguishes
# "placement does not matter here" from "everyone already covers everyone" —
# the exact trap that made the 20 km placement contrast in the class-realism
# ablation powerless, and it must be checked here before any cell is believed.
#
# Grid: 5 K-values x 17 methods x 10 seeds = 850 jobs, ~10-14 h on 12 vCPU.
# Checkpointed per (K, seed, method) — safe to interrupt and relaunch.
calibrate_path_loss: false
extends: tuned_weights.yaml

name: paper_uav_count
results_dir: results/paper_uav_count

n_workers: 12
n_seeds: 10
optimizer_seed: 9876
epicentre: [37.488, 137.272]

N: 200                       # fixed client count; only the fleet sweeps

# (K, capacity) pairs, K*C = 120 throughout. Explicit rather than derived so
# the design is auditable from this file alone; run_uav_sweep warns if the
# products drift by more than 2x.
K_values:
  - {K: 5,  capacity: 6}     #  30 slots — placement most stressed
  - {K: 10, capacity: 6}     #  60 slots
  - {K: 15, capacity: 6}     #  90 slots
  - {K: 20, capacity: 6}     # 120 slots — paper_full's operating point
  - {K: 30, capacity: 6}     # 180 slots — top of the binding range

data:
  source: real
  subsample: 1.0
  seed: 42
  data_dir: ./data
  feature_batch_size: 32
  feature_num_workers: 8
  N_clients: 200

fl:
  K: 20                      # overridden per job by run_uav_sweep
  capacity: 6                # overridden per job by run_uav_sweep
  # Altitude band + R_comm chosen together — see paper_full.yaml and
  # tests/sanity_checks/check_altitude_band.py. z*(2000 m) ~= 740 m, interior.
  z_min_m: 100.0
  z_max_m: 2000.0
  R_comm: 5000.0             # FIXED at the paper operating point — K is the variable
  link_model: path_loss
  uniform_coverage_radius: true
  n_rounds: 100
  n_local_epochs: 2
  n_uav_epochs: 2
  batch_size: 32
  T_sel: 5
  reselect_every: 1
  lambda_min: 0.5
  R_min: 0.3
  placement_method: pso
  balanced_sampling: false
  local_optimizer:
    name: sgd
    momentum: 0.9
  server_lr: 1.0
  fusion_owner: uav
  # Left ON to match paper_coverage and paper_full, so this sweep is directly
  # comparable to both. Its contribution is measured separately by the
  # class-realism arms, not here.
  placement_class_aware: true
  class_source: "true"
  target_metric: macro_f1
  target_value: 0.45

budget:
  P: 50
  G_max: 30

optimizer_params:
  mozaffari2016:
    environment: suburban
    freq_ghz: 2.0
    max_path_loss_db: 145.0
  alzenad2017:
    environment: suburban
    freq_ghz: 2.0
    max_path_loss_db: 145.0

# Same 17 methods as paper_coverage, so the two sweeps are directly comparable.
methods:
  - mclp_place        # PROPOSED: candidate-set placement (1D altitude + 2D covering)
  - proposed_hfl      # PSO placement, repositioned every T_sel
  - ga_place
  - de_place
  - gwo_place
  - pso_cluster_place # Sawalmeh et al., Sensors 22(1):223, 2021
  - spiral_place      # Lyu et al., IEEE Comm. Lett. 21(3), 2017
  - mozaffari2016     # Mozaffari et al., IEEE Comm. Lett. 20(8), 2016
  - alzenad2017       # Alzenad et al., IEEE WCL 6(4), 2017
  - cap_kmeans_place
  - ahc_place
  - moon2022          # Moon, Dung & Kim, Electronics 11(7):1036, 2022
  - mogoa             # Almaameri & Blazovics, Cluster Comput. 29:392, 2026
  - centroid_place    # naive: k-means centroids
  - random_place      # naive: uniform-random UAV positions (placement floor)
  - hfl_static        # PSO placement ONCE (isolates repositioning cadence)
  - flat_fl           # no UAVs — MUST be flat across K (validity check)
