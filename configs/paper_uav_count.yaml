# Fleet-size sweep — how much does the placement algorithm matter as K varies?
#
# The question
# ------------
# The 2026-08-07 coverage sweep found that placement method does not move
# macro-F1: 6 of 105 placement-vs-placement comparisons significant, and
# `mclp_place` never Holm-beats uniform-random placement at any radius. That
# sweep is now void — it ran under the 20-120 m altitude band, where the
# radius-maximizing altitude pinned at the ceiling for any radius above ~324 m
# and the 20 km cells were a 97% NLoS grazing link. Placement was being measured
# almost entirely outside the regime where the channel has an interior optimum.
#
# This sweep runs in the corrected regime (100-1000 m band, R_comm = 2 km, both
# inside the coherent interval) and varies the fleet instead of the radio.
#
# The grid GROWS rather than shrinks, which is the opposite of this file's first
# version. A 1-round probe (results/probe_coverage_vs_k) measured coverage at
# R_comm = 2 km:
#
#     K      mclp_place   random_place
#     20        42.5%          8.0%
#     40        68.0%         18.5%
#     60        89.0%         25.5%
#    100        99.0%         37.0%
#    200        99.5%         54.0%
#
# Two things follow. Placement is *decisive* here — 5.3x at K=20 — so the
# earlier "placement does not move macro-F1" null was an artifact of measuring
# in the saturated, physically degenerate 20 km regime. And shrinking the fleet
# below 20 would only have produced more majority-class collapse: K=20 with PSO
# placement already covers just 24%, which drove f1_missing to 0.004.
#
# So the question the sweep asks is the operational one: how large a fleet does
# a given placement rule need to reach usable coverage? Good placement reaching
# 89% at K=60 where random needs several hundred aircraft is a far stronger
# claim than a macro-F1 delta, and it is the honest framing for a method whose
# value showed up in coverage rather than in end-task accuracy.
#
# Why capacity is swept WITH K (the design decision that makes this readable)
# ---------------------------------------------------------------------------
# Holding per-UAV capacity fixed at 6 would make total training slots K*C scale
# with the fleet: K=2 would give 12 slots for 200 clients. The model would then
# be starved of data at exactly the cells where placement is most stressed, and
# a flat macro-F1 across methods would be uninterpretable — data starvation and
# placement irrelevance look identical in that column.
#
# So each K is paired with a capacity holding K*C = 120 exactly, the same total
# as paper_full. Per-round data volume is capped identically in every cell, so a
# larger fleet buys coverage rather than throughput and the comparison stays
# about placement. Capacities run 6 down to 1 across the grid, all operationally
# plausible for an aerial base station — unlike the first version of this file,
# which needed 60 clients on one aircraft to hold the product fixed at K=2.
#
# Note the slot budget still binds at the top of the grid: at K=120 the fleet
# covers ~99% (198 clients) against 120 slots, so selection remains exercised
# throughout rather than going slack as coverage saturates.
#
# Built-in validity check: `flat_fl` has no UAVs, so its row MUST be flat across
# every K. If it is not, the sweep is leaking something that is not placement.
#
# Read `coverage_pct` next to `macro_f1` in every cell. It is what distinguishes
# "placement does not matter here" from "everyone already covers everyone" —
# the exact trap that made the 20 km placement contrast in the class-realism
# ablation powerless, and it must be checked here before any cell is believed.
#
# Grid: 5 K-values x 17 methods x 10 seeds = 850 jobs, ~10-14 h on 12 vCPU.
# Checkpointed per (K, seed, method) — safe to interrupt and relaunch.
calibrate_path_loss: false
extends: tuned_weights.yaml

name: paper_uav_count
results_dir: results/paper_uav_count

n_workers: 12
n_seeds: 10
optimizer_seed: 9876
epicentre: [37.488, 137.272]

N: 200                       # fixed client count; only the fleet sweeps

# (K, capacity) pairs, K*C = 120 throughout. Explicit rather than derived so
# the design is auditable from this file alone; run_uav_sweep warns if the
# products drift by more than 2x.
K_values:
  - {K: 20,  capacity: 6}
  - {K: 30,  capacity: 4}
  - {K: 40,  capacity: 3}
  - {K: 60,  capacity: 2}
  - {K: 120, capacity: 1}

data:
  source: real
  subsample: 1.0
  seed: 42
  data_dir: ./data
  feature_batch_size: 32
  feature_num_workers: 8
  N_clients: 200

fl:
  K: 20                      # overridden per job by run_uav_sweep
  capacity: 6                # overridden per job by run_uav_sweep
  # Altitude band + R_comm chosen together — see paper_full.yaml and
  # tests/sanity_checks/check_altitude_band.py. z*(2000 m) ~= 740 m, interior.
  z_min_m: 100.0
  z_max_m: 1000.0
  R_comm: 2000.0             # FIXED at the paper operating point — K is the variable
  link_model: path_loss
  uniform_coverage_radius: true
  n_rounds: 100
  n_local_epochs: 2
  n_uav_epochs: 2
  batch_size: 32
  T_sel: 5
  reselect_every: 1
  lambda_min: 0.5
  R_min: 0.3
  placement_method: pso
  balanced_sampling: false
  local_optimizer:
    name: sgd
    momentum: 0.9
  server_lr: 1.0
  fusion_owner: uav
  # Left ON to match paper_coverage and paper_full, so this sweep is directly
  # comparable to both. Its contribution is measured separately by the
  # class-realism arms, not here.
  placement_class_aware: true
  class_source: "true"
  target_metric: macro_f1
  target_value: 0.45

budget:
  P: 50
  G_max: 30

optimizer_params:
  mozaffari2016:
    environment: suburban
    freq_ghz: 2.0
    max_path_loss_db: 145.0
  alzenad2017:
    environment: suburban
    freq_ghz: 2.0
    max_path_loss_db: 145.0

# Same 17 methods as paper_coverage, so the two sweeps are directly comparable.
methods:
  - mclp_place        # PROPOSED: candidate-set placement (1D altitude + 2D covering)
  - proposed_hfl      # PSO placement, repositioned every T_sel
  - ga_place
  - de_place
  - gwo_place
  - pso_cluster_place # Sawalmeh et al., Sensors 22(1):223, 2021
  - spiral_place      # Lyu et al., IEEE Comm. Lett. 21(3), 2017
  - mozaffari2016     # Mozaffari et al., IEEE Comm. Lett. 20(8), 2016
  - alzenad2017       # Alzenad et al., IEEE WCL 6(4), 2017
  - cap_kmeans_place
  - ahc_place
  - moon2022          # Moon, Dung & Kim, Electronics 11(7):1036, 2022
  - mogoa             # Almaameri & Blazovics, Cluster Comput. 29:392, 2026
  - centroid_place    # naive: k-means centroids
  - random_place      # naive: uniform-random UAV positions (placement floor)
  - hfl_static        # PSO placement ONCE (isolates repositioning cadence)
  - flat_fl           # no UAVs — MUST be flat across K (validity check)
