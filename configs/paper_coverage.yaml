# Coverage-constrained sweep — does placement quality matter for FL accuracy?
#
# At the paper_full R_comm = 20 km every client is covered, so placement method
# barely moves macro_f1 (proposed ≈ mozaffari ≈ alzenad). This sweep varies
# R_comm at fixed N so coverage BINDS: as the radius shrinks, a better placement
# (proposed_hfl's adaptive, class-aware PSO) covers more — and more rare-class —
# clients, so macro_f1 separates by placement. Directly connects the Tier-1
# placement quality result to the end task.
#
# Fairness (two parts):
#   1. uniform_coverage_radius=true gates EVERY method's coverage at the scalar
#      R_comm (the Tier-1 equal-radius rule), so a path-loss baseline's own
#      radius can't bypass a tight R_comm — only PLACEMENT differs.
#   2. calibrate_path_loss=true re-derives mozaffari/alzenad's max_path_loss_db
#      per swept R_comm (path_loss_db_for_radius) so they PLACE for the radius
#      they are gated at. Without it they place for a 20 km radius, get gated at
#      2 km, and lose on the mismatch rather than on their placement rule — the
#      first run of this sweep showed exactly that artifact (mozaffari covered
#      only 7% at R=2 km vs 27% for the others).
#
# Baseline design note: hfl_static is NOT a bad-placement arm — it runs PSO
# placement once instead of every T_sel rounds, so with static clients it ties
# the proposed system and isolates *repositioning cadence*, not placement
# quality. centroid_place / random_place supply the missing naive-placement
# contrast (identical UCB selection, reputation FedAvg, and cadence).
#
# Grid: 6 R_comm × 7 methods × 10 seeds = 420 jobs at fixed N=200.
# Subsumed by fl.link_model=path_loss: every method now derives its coverage
# radius from its own altitude through ONE shared, per-R_comm-calibrated
# channel, so there is no per-baseline budget left to calibrate separately.
calibrate_path_loss: false
extends: tuned_weights.yaml

name: paper_coverage
# v5 dir: the radius grid changed with the altitude-band fix (2026-08-08), so
# reusing results/paper_coverage would leave R250/R4000/R8000/R20000 behind as
# orphans from the retired grid — directories that look like results and are not.
# The v4 data stays put, unmixed and still readable, at results/paper_coverage.
results_dir: results/paper_coverage_v5

n_workers: 12
n_seeds: 10
optimizer_seed: 9876
epicentre: [37.488, 137.272]

N: 200                       # fixed client count; only R_comm sweeps
# Realistic ground radii. The previous grid bottomed out at 2 km, where every
# method already covers most clients, so placement could not separate; and the
# 20 km end is the saturated regime where coverage is unfalsifiable. These
# values are the achievable radius at the channel-optimal altitude.
# Rebuilt 2026-08-08 for the 100-1000 m altitude band. The coherent radius
# interval is z/tan(theta_opt) = 270 m .. 2700 m: outside it the radius-
# maximizing altitude pins at a band edge and the vertical decision is
# degenerate, so radii of 4/8/20 km were measuring a 97%-NLoS grazing link with
# every UAV parked at the ceiling. The grid now spans the interval where the
# channel actually has an interior optimum.
R_comm_values:               # metres
  - 300
  - 500
  - 800
  - 1200
  - 1800
  - 2500

data:
  source: real
  subsample: 1.0
  seed: 42
  data_dir: ./data
  feature_batch_size: 32
  feature_num_workers: 8
  N_clients: 200

fl:
  K: 60              # see paper_full.yaml: K=20 starves at the coherent radius
  z_min_m: 100.0
  z_max_m: 1000.0
  R_comm: 2000.0             # overridden per job by run_coverage_sweep
  # Air-to-ground link model: each UAV's coverage radius is derived from its own
  # altitude through the shared Al-Hourani channel, calibrated per job so the
  # best achievable radius equals the swept R_comm. This is what makes altitude
  # a real decision (a flat gate makes lower always better) and it retires the
  # uniform-radius override — nobody has a private radius left to be gated for.
  link_model: path_loss
  uniform_coverage_radius: true   # inert under path_loss; kept for range_gate runs
  capacity: 2        # 60 x 2 = 120 slots, selection still binds
  n_rounds: 100
  n_local_epochs: 2
  n_uav_epochs: 2
  batch_size: 32
  T_sel: 5
  reselect_every: 1
  lambda_min: 0.5
  R_min: 0.3
  placement_method: pso
  balanced_sampling: false
  local_optimizer:
    name: sgd
    momentum: 0.9
  server_lr: 1.0
  fusion_owner: uav
  placement_class_aware: true
  target_metric: macro_f1
  target_value: 0.45

budget:
  P: 50
  G_max: 30

# Placement comparison: proposed (adaptive PSO placement) vs the physics
# baselines vs no-repositioning vs no-UAV. All share the proposed selection /
# reputation / cadence — only the placement rule differs.
optimizer_params:
  # Mozaffari 2016 takes no path-loss budget: its radius comes from the circle
  # packing and its altitude from the antenna beamwidth (verified against the
  # source PDF 2026-08-06). Alzenad's theta_opt is a function of the environment
  # alone, and its radius now comes from the shared link model.
  mozaffari2016:
    theta_b_deg: 80.0
  alzenad2017:
    environment: suburban
  moon2022:
    environment: suburban

methods:
  - mclp_place        # PROPOSED: candidate-set placement (1D altitude + 2D covering)
  - proposed_hfl      # PSO placement, repositioned every T_sel
  - ga_place          # GA over raw UAV coordinates
  - de_place          # differential evolution control
  - gwo_place         # grey wolf control
  - pso_cluster_place # Sawalmeh et al., Sensors 22(1):223, 2021
  - spiral_place      # Lyu et al., IEEE Comm. Lett. 21(3), 2017
  - mozaffari2016     # Mozaffari et al., IEEE Comm. Lett. 20(8), 2016
  - alzenad2017       # Alzenad et al., IEEE WCL 6(4), 2017
  - cap_kmeans_place  # capacity-constrained k-means
  - ahc_place         # agglomerative clustering + minimax centre
  - moon2022          # Moon, Dung & Kim, Electronics 11(7):1036, 2022
  - mogoa             # Almaameri & Blazovics, Cluster Comput. 29:392, 2026
  - centroid_place    # naive: k-means centroids
  - random_place      # naive: uniform-random UAV positions (placement floor)
  - hfl_static        # PSO placement ONCE (isolates repositioning cadence)
  - flat_fl           # no UAVs at all (coverage-independent reference)
