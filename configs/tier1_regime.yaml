# Stage-2 assessment: binding-capacity regime, homogeneous fleet, equal radius.
#
# The published tier1_core runs at capacity=30, K=10 -> 300 slots > N=250, so
# capacity NEVER binds and the only active constraint is the coverage radius.
# That saturates clustered/epicenter (88-97% covered) and starves uniform
# (46%), leaving little room for a global optimizer to separate from greedy
# physics placement.
#
# Here capacity=15, K=10 -> 150 slots < 250 clients: capacity binds, so the
# optimizer must choose *which* high-value devices to serve, not just where to
# hover. Coverage lands in the differentiating ~55-70% band. Equal radius is
# inherited from tier1_equal_radius (baselines at max_path_loss_db=95, r*=499 m
# == R_comm) so no method gets a coverage-area handicap.
#
# This is the homogeneous-fleet control; tier1_regime_hetero.yaml is the paired
# heterogeneous-fleet treatment (same device layouts, varied per-UAV capacity).
extends: tier1_equal_radius.yaml

name: tier1_regime
results_dir: results/tier1_regime

n_seeds: 20

problem:
  R_comm: 500.0
  B_min_uav: 0.2
  capacity: 15        # 10 UAVs * 15 = 150 slots < 250 clients -> capacity binds
  uav_battery: 1.0
  prev_mode: stale
  capacity_cv: 0.0    # homogeneous fleet (control)
  battery_cv: 0.0
