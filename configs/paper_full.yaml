# Full paper system simulation — §V comparison (Table III + Figures 4-8).
#
# Runs 13 methods × 4 N-values × 10 seeds = 520 jobs on 12 parallel workers.
# Estimated wall-clock: ~35-45 hours on a 12-vCPU VM (100 rounds, full
# dataset; checkpointed per job — safe to stop/relaunch).
#
# Methods (system + ablations):
#   proposed_hfl      — PSO placement every T_sel=5 rounds (or λ_min trigger) + UCB selection + reputation FedAvg
#   flat_fl           — no UAVs, all clients, server aggregates directly (FedAvg baseline [27])
#   centralized       — oracle upper bound (all data at one node)
#   hfl_no_selection  — random client selection ablation
#   hfl_static        — no UAV repositioning ablation
#   hfl_no_reputation — uniform (sample-weighted) aggregation ablation
#
# Literature baselines (Algorithms B1-B3, REPORTS/master_implementation_reference.md Appendix C) —
# same PSO placement / reputation FedAvg / T_sel cadence as proposed_hfl,
# only the selection rule differs. Report these in a table separate from the
# ablations above ("vs. literature" and "vs. our own ablations" answer
# different questions):
#   fedcs             — B1: FedCS greedy deadline selection (Nishio & Yonetani, ICC 2019)
#   rep_cap           — B2: reputation-capability ranking (Zhao et al., Chin. J. Aeronaut. 2024)
#   fair_mab          — B3: fairness/energy MAB selection (Zhu et al., Sensors 2024)
#   oort              — B4: Oort guided participant selection (Lai et al., OSDI 2021)
#   power_of_choice   — B5: Power-of-Choice loss-based sampling (Cho et al., 2020)
#
# Requires HF_TOKEN for the real dataset. The pipeline is real-data only;
# for a fast end-to-end check use `uavbench smoke_tier2` (reduced real config).

extends: tuned_weights.yaml   # lr, uav_lr, logit_adjust_tau, server_momentum

name: paper_full_system
results_dir: results/paper_full

n_workers: 12
n_seeds: 10          # repetitions for CIs AND paired Wilcoxon power: with 3
                     # seeds the two-sided minimum p is 0.25, so no comparison
                     # could ever be significant; n=10 gives min p ≈ 0.002,
                     # comfortably below the Holm-corrected threshold
optimizer_seed: 9876

# Noto Peninsula 2024 earthquake epicentre (lat °N, lon °E)
epicentre: [37.488, 137.272]

data:
  source: real
  subsample: 1.0     # 100% of dataset (~128 k rows)
  seed: 42
  # Three-way split: 80% train / 10% val / 10% test (train_ratio 0.8 default).
  # Before 2026-08 there was no val split at all and scripts/tune_weights.py
  # maximized macro-F1 on the *reported test set* — 22 hyperparameters chosen
  # by looking at the answer. Every selection decision now reads val_*; only
  # final reported numbers read the test columns.
  val_ratio: 0.1
  data_dir: ./data
  feature_batch_size: 32
  # DataLoader workers for the one-time ResNet feature pass (TIF decode is the
  # bottleneck). Runs in the sequential prefetch phase, before the 12 sweep
  # workers fork, so 8 decode processes fit the n1-standard-12 budget.
  feature_num_workers: 8
  # N_clients is overwritten per-job by run_paper_sweep (one of N_values below).
  # This default only matters if run_full_hfl is called directly on this file.
  N_clients: 50

fl:
  # K and capacity are set from PER-UAV CAPACITY, which is what governs whether
  # this pipeline learns at all. Neither coverage nor participation predicts it,
  # and assuming they did cost three failed launches on 2026-08-08.
  #
  # The controlled measurement (results/probe_topology, 6 cells x 3 seeds, all at
  # R_comm = 5 km, 100 rounds, mclp_place):
  #
  #     K    cap  slots  cover%  final macro-F1
  #    120    1    120    85.0      0.199    unlearns (BELOW the 0.2245 floor)
  #     60    2    120    88.7      0.274    unlearns
  #     40    3    120    86.0      0.286    unlearns
  #     30    4    120    84.8      0.379    learns
  #     20    6    120    82.3      0.395    learns   <- chosen
  #     60    6    360    98.2      0.367    learns   (off-ladder control)
  #
  # Capacity orders the outcome exactly; coverage does not order it at all. The
  # chosen cell has the LOWEST coverage in the grid and the best macro-F1, and
  # the worst cell (cap=1) sits at 85% coverage while selecting 120 clients per
  # round. So neither "not enough coverage" nor "not enough participants" is the
  # mechanism, and the earlier note here claiming a ~120-participants requirement
  # was wrong — cap=1 meets it and is the worst configuration measured.
  #
  # Why capacity and not the others: the UAV tier trains img_proj+fusion on the
  # POOLED SHARD of its assigned clients (fusion_owner: uav, below). Capacity is
  # exactly how many clients that shard pools. Noto damage classes are strongly
  # geographically clustered, so a 2-client shard inside one 5 km disc is close
  # to single-class; averaging K such heads cannot recover a class none of them
  # saw. Every cell rises to ~0.34 by round 10 and dips; only cap>=4 recovers,
  # which is the signature of forgetting rather than of starvation.
  #
  # Recorded per round as shard_minority_share / shard_class_entropy so this is
  # observable in future runs rather than needing another probe.
  #
  # NOT encoded as a cap>=4 guard anywhere. That threshold is one measurement at
  # one N and one radius, and turning a single observation into a hard rule is
  # the mistake this file already made once. The standing protection is the
  # outcome-based collapse gate (scripts/gate_collapse.py), which needs no
  # guessed threshold.
  K: 20
  # Altitude band and R_comm are chosen TOGETHER; changing one without the other
  # breaks the placement physics (2026-08-08).
  #
  # The Al-Hourani radius-vs-altitude curve peaks at a fixed elevation angle
  # (theta_opt = 20.34 deg, suburban), so the coherent ground radius is
  # z/tan(theta_opt): 270 m at z=100, 5400 m at z=2000. R_comm must sit inside
  # that interval or the optimum pins at a bound and the vertical decision goes
  # degenerate. At R_comm=5000 m the optimum is ~1850 m — interior, as required.
  #
  # The ceiling is the reach, which is why it is 2000 m and not 1000 m: raising
  # it takes the coherent radius from 2.70 km to 5.40 km, i.e. 78.5 km^2 of
  # ground per aircraft instead of 12.6 — 6x. At 2 km even a 60-UAV fleet could
  # not put enough clients in range to keep the task learnable.
  #
  # This replaces R_comm=20000 with a 20-120 m band, which was incoherent on two
  # counts: z* was pinned at the 120 m ceiling for any radius above ~324 m, and
  # at 20 km the elevation angle of 0.34 deg gave P(LoS) ~ 3%, i.e. a 97% NLoS
  # link — an aerial base station with its line-of-sight advantage switched off.
  # LinkModel never objected because it back-solves the budget the configured
  # R_comm needs. Guarded by tests/sanity_checks/check_altitude_band.py.
  #
  # Consequence to state in the paper: coverage is PARTIAL at a coherent radius,
  # so placement decides who participates. That is the regime the method is
  # actually for — and it is why placement turned out to matter here after
  # appearing irrelevant at the saturated 20 km point.
  z_min_m: 100.0     # disaster-response waiver / larger UAS class, not 400 ft small-UAS
  z_max_m: 2000.0
  R_comm: 5000.0     # coherent with the band above (z* ~= 1850 m, interior)
  capacity: 6        # see the K note above: 20 x 6 = 120 slots against the ~165
                     # clients a K=20 fleet covers at 5 km, so selection binds;
                     # and 6 is above the capacity floor where learning survives
  n_rounds: 100
  n_local_epochs: 2
  n_uav_epochs: 2      # UAV image-branch training epochs per round (paper §IV-A Step 3)
  # lr / uav_lr inherited from tuned_weights.yaml
  batch_size: 32
  T_sel: 5           # reposition UAVs every 5 FL rounds (placement cadence, paper §IV-E)
  reselect_every: 1  # client selection cadence — decoupled from placement (Tier C)
  lambda_min: 0.5    # early-reselection trigger: eligible < λ_min·min(ΣC_u, N) (§IV-E6)
  R_min: 0.3         # UAV clusters below this trimmed-mean reputation are excluded (§IV-D)
  # mclp_ls, not pso. This was `pso` as a leftover from before the candidate-set
  # placement existed, and it was actively costing coverage: at the coherent
  # R_comm = 2 km with K=60, PSO reached 51.9% of clients while mclp_ls reached
  # 64.9% at the same capacity (results/probe_coverage_vs_k, probe_participation). Running the "proposed system" on the
  # superseded placement rule understated it AND starved the FL task — the K=60
  # run at 51.9% still collapsed onto the majority class (f1_missing 0.0062,
  # macro-F1 0.266). mclp_ls wins 649/650 head-to-head and reaches 97-99% of the
  # exact capacitated-MCLP optimum, so it is the proposed rule by every measure.
  #
  # The placement SWEEPS keep placement_method: pso on purpose — there
  # `proposed_hfl` is the PSO comparison arm and `mclp_place` is the proposed
  # one, so the two rules can be compared side by side.
  placement_method: mclp_ls

  # ── Training recipe (Tier A) ──────────────────────────────────────────
  # The ENTIRE recipe — lr, uav_lr, lr_decay, logit_adjust_tau,
  # server_momentum, ema_decay, and the per-method overrides — comes from
  # tuned_weights.yaml (see `extends:` at the top). Do not restate any of it
  # here. lr_decay and ema_decay used to be set in this file, which silently
  # overrode the tuned values for every method: exactly the copied-weight drift
  # tuned_weights.yaml's header warns about.
  balanced_sampling: false  # uniform shard sampling (imbalance handled in the loss)
  local_optimizer:          # momentum SGD amortizes across rounds (unlike fresh Adam)
    name: sgd
    momentum: 0.9
  server_lr: 1.0

  # ── Hierarchy / method design (Tier B + C) ────────────────────────────
  fusion_owner: uav         # UAV tier owns img_proj+fusion (both modalities co-located)
  placement_class_aware: true   # bias PSO coverage toward rare-class-rich clients

  # ── Rounds-to-target on the reported primary metric (macro-F1) ─────────
  target_metric: macro_f1
  target_value: 0.45     # a meaningful floor (vs raw accuracy under an 0.82 majority)

budget:
  P: 50              # PSO swarm size
  G_max: 30          # PSO iterations (early-stop at 95% of w1=0.6 fires well before this)

N_values:
  - 30
  - 50
  - 100
  - 200

# Placement literature baselines (path-loss coverage radius, see
# uavbench/problem/path_loss.py). The link budget is calibrated to the
# deployment scale: 145 dB at 2 GHz gives a coverage radius on the order of
# the 20 km R_comm used by every other method at Noto Peninsula scale, so
# the placement *rule* — not an arbitrarily tighter radio — is what's
# compared. State this calibration explicitly in the paper.
optimizer_params:
  mozaffari2016:
    environment: suburban
    freq_ghz: 2.0
    max_path_loss_db: 145.0
  alzenad2017:
    environment: suburban
    freq_ghz: 2.0
    max_path_loss_db: 145.0

methods:
  - proposed_hfl
  - flat_fl
  - centralized
  - hfl_no_selection
  - hfl_static
  - hfl_no_reputation
  - fedcs
  - rep_cap
  - fair_mab
  - oort
  - power_of_choice
  - mozaffari2016
  - alzenad2017
