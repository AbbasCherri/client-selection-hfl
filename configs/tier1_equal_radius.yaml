# Saturating-capacity ablation of the Tier-1 placement benchmark.
#
# Identical to the tier1_core headline (equal-radius scoring, Bayesian fitness
# weights, all inherited) EXCEPT capacity: K*capacity = 10*30 = 300 slots > N=250
# clients, so capacity never binds and coverage saturates. Purpose: show the
# optimizer's ranking is not an artifact of the binding regime — PSO still
# dominates the physics/greedy baselines even when every client fits.
#
# (Name kept for history; "equal_radius" is now the default everywhere, not a
# distinguishing feature of this config — the distinguishing feature is the
# slack capacity.)
extends: tier1_core.yaml

name: tier1_equal_radius
results_dir: results/tier1_equal_radius

problem:
  capacity: 30   # slack: 300 slots > 250 clients -> capacity does not bind
