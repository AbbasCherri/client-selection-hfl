# Class-awareness realism ablation — arm 6/6: class-blind placement at a binding radius.
#
# The comparator for class_realism_bind. Same R_comm = 800 m, same oracle
# histogram for selection, class-aware placement OFF. This pair is the actual
# test of whether class-aware placement earns its information assumption at a
# radius where coverage binds harder than the 2 km main arms.
#
# See configs/class_realism_bind.yaml for why 800 m, and for why the earlier
# 20 km and 8 km runs of this contrast are void.

extends: class_realism.yaml

name: class_realism_bind_noplace
results_dir: results/class_realism_bind_noplace

fl:
  R_comm: 800.0
  class_source: "true"
  placement_class_aware: false
