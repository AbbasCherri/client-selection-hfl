# Install: pip install -e ".[dev]" && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Scoped to the live experimental package; src/hflsim is legacy-heavy
        # and excluded until it's either migrated or retired.
        files: ^src/uavbench/
        additional_dependencies: [numpy, pandas-stubs, types-PyYAML]
