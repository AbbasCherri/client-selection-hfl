[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "client-selection-hfl"
version = "0.2.0"
description = "Hierarchical Federated Learning simulation + UAV PSO placement for post-earthquake damage classification"
requires-python = ">=3.11"
dependencies = [
    # shared scientific stack
    "numpy>=1.24.0,<3.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.3.0",
    # HFL-specific
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "huggingface_hub>=0.32.0",
    "datasets>=2.14.0",
    "filelock>=3.12.0",
    "typing_extensions>=4.7.0",
]

# Optional editor-time conveniences only — nothing gates on these.
[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[project.scripts]
hflsim   = "hflsim.cli:main"
uavbench = "uavbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness-focused start: pyflakes/pycodestyle errors, import hygiene,
# and numpy/pyupgrade modernisation. Style-only rules stay off until the
# dedicated repo-wide formatting commit.
select = ["E4", "E7", "E9", "F", "I", "NPY", "UP"]
ignore = [
    "E741",  # ambiguous single-letter names (heavy math notation in optimizers)
]

[tool.ruff.lint.per-file-ignores]
# Legacy np.random.* in check fixtures — determinism there doesn't feed
# any reported result.
"tests/**" = ["NPY002"]
# hflsim legacy package (see its LEGACY marker): rewriting its global-RNG
# calls would silently change the historical CLI's reproducibility.
"src/hflsim/**" = ["NPY002"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
# Legacy package kept only for the hflsim CLI + UAVAggregator bridge.
exclude = "src/hflsim/simulation/"
